# HES — Codex CLI 예시 설정
# ~/.codex/config.toml 에 병합하세요. (Codex CLI 문서 기준)
#
# HES의 소스 오브 트루스는 이 저장소의 파일입니다. Codex는 저장소를 열면
# AGENTS.md 를 자동으로 읽습니다. 아래는 선택적 MCP 연동 예시입니다.

# --- (선택) Figma MCP: 토큰/컴포넌트를 Figma와 동기화할 때 ---
# 참고: Claude Code 플러그인은 공식 Figma Dev Mode MCP를 plugin.json 의 mcpServers 로
#      이미 번들 제공합니다(Claude Code에서는 아래 설정 불필요 — Figma 앱 Dev Mode만 켜면 됨).
#      아래는 Codex CLI 사용자를 위한 동일 서버(공식 Dev Mode, 로컬 http) 설정입니다.
# [mcp_servers.figma]
# type = "http"
# url = "http://127.0.0.1:3845/mcp"
#
# (대안) 개인 REST 토큰으로 커뮤니티 서버를 쓰려면 — 도구 세트가 Dev Mode와 다름:
# [mcp_servers.figma]
# command = "npx"
# args = ["-y", "figma-developer-mcp", "--stdio"]
# env = { FIGMA_API_KEY = "여기에_토큰" }

# --- (선택) 프로젝트 기본 지시 ---
# [projects."/absolute/path/to/your/product-repo"]
# 이 제품 저장소에서 UI를 만들 때는 HES 디자인 시스템 저장소의
# design-system/ 을 소스로 사용한다.

# 참고: 커스텀 프롬프트(/hes-tokens 등)는 codex/prompts/*.md 를
# ~/.codex/prompts/ 로 복사하면 슬래시 커맨드로 노출됩니다.

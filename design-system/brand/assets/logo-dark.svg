<!--
  하나머니 워드마크 플레이스홀더 — 다크 배경용
  ⚠️ 공식 하나금융그룹 CI 심볼/시그니처가 아닙니다. CI팀 제공 원본 수급 시 교체.
  사용 규칙: ../logo.md (하나그린 위에서는 전체 흰색 변형 사용)

  토큰 출처 (tokens/core.tokens.json) — 이 SVG는 렌더링 목적상 예외적으로 hex 값을 직접 사용합니다.
    - "하나"  : color.hana.green = #009178 (다크 배경 #252e33 대비 3.5:1)
    - "머니"  : color.grayScale.white = #ffffff
    - 폰트    : fontFamily.sans = Spoqa Han Sans Neo, Pretendard, system-ui, sans-serif
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 48" width="176" height="48" role="img" aria-labelledby="hds-logo-dark-title">
  <title id="hds-logo-dark-title">하나머니 (Hana Money) 워드마크 — 다크 배경용</title>
  <text x="8" y="34" font-family="Spoqa Han Sans Neo, Pretendard, system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="-1.4">
    <tspan fill="#009178">하나</tspan><tspan fill="#ffffff">머니</tspan>
  </text>
</svg>
